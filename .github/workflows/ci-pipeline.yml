name: Backend CI Pipeline

# Pipeline se spustí při pushi nebo pull requestu do větví main a develop
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Nastavíme pracovní složku na backend, protože tam máme Spring Boot
    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1. Stažení kódu z repozitáře
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Nastavení Javy (zvolte verzi 17 nebo 21 podle toho, co jste vybral ve Spring Initializr)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build aplikace a spuštění testů (Toto automaticky spustí i JaCoCo)
      - name: Build and Test with Maven
        run: mvn clean test

      # 4. Nahrání JaCoCo reportu jako artefaktu, abyste si ho mohl na GitHubu stáhnout a prohlédnout
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always() # Tento krok se provede, i když testy selžou
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/