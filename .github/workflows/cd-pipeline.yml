name: Deploy to Azure

on:
  push:
    branches:
      - develop
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          echo "--- KDE TO JSEM? ---"
          pwd
          echo "--- CO JE V KOŘENU? ---"
          ls -F
          echo "--- POKOUŠÍM SE VLEZT DO FRONTENDU ---"
          cd frontend || { echo "CHYBA: Složka frontend neexistuje!"; ls -R; exit 1; }
          npm install
          npm run build

      - name: Debug Frontend Build
        run: |
          echo "Aktuální složka: $(pwd)"
          echo "Obsah složky frontend:"
          ls -R frontend/dist || echo "Složka dist neexistuje!"

      - name: Copy Frontend to Backend
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: backend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stin-prikryl-currency-analyzer'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/target/*.jar
