<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Currency Analyzer</title>
</head>

<body class="flex flex-col min-h-screen">
    <header class="bg-gray-200 w-screen p-4 flex justify-between items-center sticky top-0">
        <p class="font-semibold ml-4 text-gray-600">Currency Analyzer</p>
        <div class="bg-gray-600 w-5 h-5"></div>
    </header>


    <main class="bg-gray-200 w-screen p-8 mt-16 flex flex-col grow gap-16">
        <div class="bg-gray-600 flex w-full items-center p-4 gap-4">
            <div class="bg-gray-200 w-20 h-20">
                <label for="base-currency" class="font-light text-xs">Base Currency</label>
                <select name="Base Currency" id="base-currency"
                class="dropdown [&_option::checkmark]:hidden">
                    <option value="">EUR</option>
                    <option value="">CZK</option>
                    <option value="">USD</option>
                </select>
            </div>
            <div class="bg-gray-200 w-20 h-20"></div>
            <div class="bg-gray-200 w-20 h-20"></div>
            <button class="bg-gray-200 py-2 px-4 rounded-full">Calculate</button>
        </div>

        <div class="bg-gray-600 flex flex-col w-full p-4 gap-8">
            <div class="flex gap-8 bg-gray-200 w-full justify-center">
                <div class="bg-amber-400 w-40 h-40"></div>
                <div class="bg-amber-400 w-40 h-40"></div>
            </div>
            <table class="bg-gray-200">
                <th>
                    <td>Currency</td>
                    <td>Average Rate</td>
                </th>
            </table>
        </div>
    </main>


    <footer class="bg-gray-200 p-4 mt-4">
        <p class="text-center">footer</p>
    </footer>
</body>

</html>
