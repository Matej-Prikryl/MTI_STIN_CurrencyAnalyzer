<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <title data-i18n="app-title">Currency Analyzer</title>
</head>

<body class="flex flex-col min-h-screen">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>
    
    <header class="bg-gray-200 w-screen p-4 flex justify-between items-center sticky top-0">
        <p data-i18n="app-title" class="font-semibold ml-4 text-gray-600">Currency Analyzer</p>
        <div class="bg-gray-600 w-5 h-5"></div>
    </header>


    <main class="w-screen p-8 mt-16 flex flex-col items-center grow gap-4">
        <div class=" flex w-full items-center gap-8 justify-center">
            <div class="w-24 h-20">
                <label data-i18n="base-currency" for="base-currency" class="font-light text-xs w-max">Base Currency</label>
                <select name="Base Currency" id="base-currency"
                class="dropdown [&_option::checkmark]:hidden">
                    <option value="EUR">EUR</option>
                    <option value="CZK">CZK</option>
                    <option value="USD">USD</option>
                </select>
            </div>
            <div class="w-36 h-20">
                <label data-i18n="start-date" for="start-date" class="font-light text-xs">From</label>
                <input type="text" id="start-date" placeholder="Select start date" class="datepicker">
            </div>
            <div class="w-36 h-20">
                <label data-i18n="end-date" for="end-date" class="font-light text-xs">To</label>
                <input type="text" id="end-date" placeholder="Select end date" class="datepicker">
            </div>
        </div>

        <button data-i18n="calculate-btn" id="calculate-btn" class="bg-indigo-600 text-white text-xl font-semibold py-2 px-4 rounded-full w-max hover:bg-indigo-500 cursor-pointer active:bg-indigo-400">Calculate</button>

        <div class="flex flex-col max-w-4xl p-4 gap-8 mt-12">
            <div class="flex gap-8 w-full justify-center">
                <div id="strongest-currency" class="currency-extreme-display">
                    <label data-i18n="strongest-currency">Strongest</label>
                    <h1>--</h1>
                    <p>0.00</p>
                </div>
                <div id="weakest-currency" class="currency-extreme-display">
                    <label data-i18n="weakest-currency">Weakest</label>
                    <h1>--</h1>
                    <p>0.00</p>
                </div>
            </div>
            <table class="rates-table">
                <thead>
                    <tr>
                        <th data-i18n="currency" class="rounded-tl-2xl">Currency</th>
                        <th data-i18n="average-rate" class="rounded-tr-2xl">Average Rate</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td>--</td>
                        <td>0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>


    <footer class="bg-gray-200 p-4 mt-4">
        <p class="text-center">footer</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
