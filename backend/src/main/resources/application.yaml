spring:
  application:
    name: backend
  profiles:
    active: dev
  web:
    resources:
      static-locations: "classpath:/static/, file:./frontend/"
server:
  port: 8080
api:
  exchangerate:
    key: "7ad99c6f0c46b20449f9793997e78112"
